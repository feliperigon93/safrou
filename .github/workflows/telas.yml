name: Gerar telas para a loja
on: { workflow_dispatch: {} }
jobs:
  telas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node scripts/build-www.mjs && node scripts/screenshots.mjs
      - uses: actions/upload-artifact@v4
        with: { name: telas-app-store, path: loja/telas }
