<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<!--FONTS-->

</head><body>
<title>Safrou</title>
<style>
/* Layout: app de uma coluna — cabeçalho fixo com busca, filtros em chips, lista de fichas, ficha do produto em painel sobreposto, faixa de anúncio no rodapé */
:root{
  --bg:#f4f7f2; --surface:#ffffff; --surface-2:#f4f7f2; --ink:#17251b; --muted:#4f6155; --line:#dce5da;
  --accent:#1e7a3e; --accent-soft:#e3f2e6; --accent-ink:#ffffff; --hdr:#1e7a3e; --grain:#f4b62a;
  --bio:#0d7368; --bio-soft:#d5efea;
  --tox1:#c42b2b; --tox3:#c99300; --tox4:#1d58a6; --toxnc:#2c7a35;
  --warn-soft:#fdf1d3; --warn-ink:#6b4800;
  --f-display:"Sora",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#18211b; --surface-2:#1d2820; --ink:#e6eee7; --muted:#9db0a2; --line:#2c3a30;
  --accent:#5fbf7f; --accent-soft:#1f3a29; --accent-ink:#0b130e; --hdr:#14402a; --grain:#f4b62a;
  --bio:#4fc7b8; --bio-soft:#123a35;
  --tox1:#ff6b6b; --tox3:#f0c040; --tox4:#6aa2ff; --toxnc:#67c16f;
  --warn-soft:#3a3018; --warn-ink:#f3d78a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#18211b; --surface-2:#1d2820; --ink:#e6eee7; --muted:#9db0a2; --line:#2c3a30;
  --accent:#5fbf7f; --accent-soft:#1f3a29; --accent-ink:#0b130e; --hdr:#14402a; --grain:#f4b62a;
  --bio:#4fc7b8; --bio-soft:#123a35;
  --tox1:#ff6b6b; --tox3:#f0c040; --tox4:#6aa2ff; --toxnc:#67c16f;
  --warn-soft:#3a3018; --warn-ink:#f3d78a; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:relative;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font:700 26px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.srcbadge{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.search{position:relative}
.search input{width:100%;padding:12px 14px 12px 42px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:17px}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters .sel{display:flex;gap:8px;flex:1 1 100%;flex-wrap:wrap}
.filters .sel label{flex:1 1 180px;min-width:0;display:grid;gap:2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.filters .sel input,.filters .sel select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}

main .wrap{padding-block:14px 24px;display:grid;gap:12px}
.count{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.clear{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.list{display:grid;gap:8px}
.card{display:grid;grid-template-columns:6px 1fr;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;width:100%}
.card:hover{border-color:var(--accent)}
.band{background:var(--muted)}
.band.t1,.band.t2{background:var(--tox1)} .band.t3{background:var(--tox3)} .band.t4,.band.t5{background:var(--tox4)} .band.tnc{background:var(--toxnc)}
.card .body{padding:10px 14px;display:grid;gap:4px;min-width:0}
.card .l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card .name{font:700 20px/1.1 var(--f-display);letter-spacing:.01em;overflow-wrap:anywhere}
.card .ia{font-size:14.5px;color:var(--ink);overflow-wrap:anywhere}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.reg{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.bio{background:var(--bio-soft);color:var(--bio)}
.pill.org{background:transparent;border:1px solid var(--toxnc);color:var(--toxnc)}
.more{justify-self:center;border:1px solid var(--line);background:var(--surface);padding:9px 20px;border-radius:999px;font-weight:600}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:10px}
.empty h2{margin:0;font:700 22px/1.1 var(--f-display);text-transform:uppercase;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ficha */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.sheet .bar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:2}
.sheet .bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;font-weight:600}
.sheet .bar .t{font:700 18px/1.1 var(--f-display);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sheet .wrap.content{padding-block:16px 24px;display:grid;gap:14px}
.hero{display:grid;gap:8px}
.hero h2{margin:0;font:700 34px/1 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.hero .aka{font-size:14px;color:var(--muted)}
.toxband{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:#fff;font-weight:600;font-size:14.5px}
.toxband.t1,.toxband.t2{background:#c42b2b}.toxband.t3{background:#d9a400;color:#1a1400}.toxband.t4,.toxband.t5{background:#1d58a6}.toxband.tnc{background:#2c7a35}.toxband.tx{background:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.box h3{margin:0;font:700 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.ialist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.ialist li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ialist li:last-child{border:0;padding:0}
.ialist .n{font-weight:600;overflow-wrap:anywhere;min-width:0}
.ialist .n small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.ialist .c{font:500 14px var(--f-mono);white-space:nowrap}
.cult{border-top:1px solid var(--line)}
.cult:first-of-type{border-top:0}
.cult summary{cursor:pointer;padding:9px 0;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
.cult summary::-webkit-details-marker{display:none}
.cult summary span{color:var(--muted);font-weight:500;font-size:13.5px;white-space:nowrap}
.cult[open] summary{color:var(--accent)}
.cult ul{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:4px}
.cult li{font-size:14.5px;display:grid}
.cult li i{color:var(--muted);font-size:13px}
.cult li.hit{background:var(--warn-soft);border-radius:6px;padding:2px 6px}
.cfilter{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.gen{display:grid;gap:6px}
.gen button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px}
.gen button b{font:700 17px/1.1 var(--f-display);overflow-wrap:anywhere;min-width:0}
.gen button span{font-size:12.5px;color:var(--muted);text-align:right}
.note{font-size:13.5px;color:var(--warn-ink);background:var(--warn-soft);border-radius:8px;padding:10px 12px}
.muted{color:var(--muted);font-size:14px;margin:0}

/* anúncio */
.ad{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.ad .wrap{height:56px;display:flex;align-items:center;justify-content:center}
.ad .slot{width:100%;max-width:468px;height:44px;border:1.5px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* admin */
.admin{display:grid;gap:10px}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.adminlink{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink)}
.ffgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ffgrid label,.flabel{display:grid;gap:3px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ffgrid input,.ffgrid select,#folForm textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.gargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:4px}
.gargrid label{display:grid;gap:2px;font:700 14px var(--f-display);color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.cgrid label{display:grid;gap:3px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.cgrid input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:16px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
.cgrid .gin input{border:0;background:none}
.tablewrap{overflow-x:auto;min-width:0;max-width:100%}
.box>*{min-width:0}
.zad table{width:100%}
details.box{display:block}
details.box>*+*{margin-top:10px}
.zad .ctab td,.zad .ctab th,.zad .ctab td:not(:first-child){white-space:normal;overflow-wrap:break-word;font-size:13.5px;padding-inline:4px}
.ctab{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.ctab th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ctab td{padding:7px 8px;border-bottom:1px dashed var(--line)}
.ctab td:not(:first-child){white-space:nowrap}
.calc{border-color:var(--accent)}
.box>*{min-width:0}
.cout{display:grid;gap:10px;min-width:0}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpis>div{flex:1 1 130px;background:var(--accent-soft);border-radius:8px;padding:8px 12px;display:grid;gap:2px}
.kpis span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpis b{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted);font-size:12.5px}
.gin.sm{min-width:110px}.gin.sm input{width:60px}
.sm1{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:15px}
.kit td{vertical-align:middle}
.pill.moa{background:var(--warn-soft);color:var(--warn-ink);font-family:var(--f-mono);font-size:11.5px}
.ialist .n small .pill{margin-right:4px}
.prog li{line-height:1.6}
.kit td:first-child{min-width:140px}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;font-size:18px;line-height:1}
.tabs{flex-wrap:nowrap}
@media (max-width:520px){.tabs{width:100%}.tabs button{flex:1 1 0;padding:6px 4px;font-size:13.5px;text-align:center}}
.star{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;font-weight:600;white-space:nowrap}
.star[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:grid;gap:8px}
.mcard.low{border-color:var(--tox1)}
.mhead{display:flex;gap:10px;align-items:flex-start}
.mopen{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:grid;gap:2px}
.mopen b{font:700 19px/1.1 var(--f-display);overflow-wrap:anywhere}
.mopen span{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.mrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.mrow label{display:grid;gap:3px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.mval{display:grid;gap:3px;margin-left:auto;text-align:right}
.mval span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.mval b{font-variant-numeric:tabular-nums}
.mlow{margin:0;color:var(--tox1);font-weight:600;font-size:14px}
.refp{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.refline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.refline span{flex:1 1 100%;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.refline b{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.refline small{color:var(--muted)}
.sharerow{display:flex;gap:8px;flex-wrap:wrap}
.sharerow select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.mud summary{cursor:pointer}
.mud h3{margin-top:6px}
.kpis>.kwarn{background:var(--warn-soft)}
.kpis>.kwarn b{color:var(--tox1)}
.cgrid select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:16px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
.cgrid input:disabled{opacity:.6}
.cgrid .gin select{width:auto;padding:0 4px;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--surface);font-size:12px}
.zleg{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:600}
.zleg span{padding:2px 8px;border-radius:6px}
.z2{background:#2e8b47;color:#fff}.z3{background:#e3b505;color:#231a00}.z4{background:#e0702a;color:#fff}.z9{background:var(--accent)}.z0{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.zcard{gap:8px}
.zhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.zcal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.zm{display:grid;gap:3px;text-align:center}
.zm span{font-size:11px;color:var(--muted);font-weight:600}
.zm div{display:grid;grid-template-rows:repeat(3,10px);gap:2px}
.zm i{display:block;border-radius:2px;height:10px}
.poscard{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.poscard td div{white-space:nowrap}
.zad summary{cursor:pointer}
.zad td,.zad th{white-space:normal}
.zjan{margin:0;font-size:15px;line-height:1.6}
@media (max-width:520px){.zm span{font-size:9.5px}}
.semads{font-size:12.5px;padding:3px 10px;align-self:center;border-color:var(--accent);color:var(--accent);background:var(--surface)}
.procard{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.procard h3{margin:0;font:700 20px/1.1 var(--f-display);text-transform:uppercase;color:var(--accent)}
.procard p{margin:0}
.sug{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.sug>div:first-child{min-width:0}
.gin{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.gin input{width:100%;min-width:0;border:0;background:none;padding:6px 8px;font:400 15px var(--f-body)}
.gin select{border:0;border-left:1px solid var(--line);background:var(--surface);font-size:12px;padding:0 2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.filters .sel{flex:1 1 auto}header.top{position:sticky;top:env(safe-area-inset-top,0px)}}
.chip.ft{margin-left:auto}
/* ===== Safrou: identidade ===== */
body{padding-bottom:calc(122px + env(safe-area-inset-bottom,0px))}
body::before{background:var(--hdr)}
header.top{background:var(--hdr);color:#fff;border-bottom:0;border-radius:0 0 24px 24px}
header.top .wrap{padding-block:12px 16px}
.brand{align-items:center;gap:8px}
.brand h1{font:800 25px/1 var(--f-display);letter-spacing:-.045em;text-transform:none;color:#fff}
.semads{background:var(--grain)!important;color:#17251b!important;border:0!important;font-weight:700;padding:6px 12px!important}
.search input{background:#fff;color:#17251b;border-color:transparent;border-radius:14px}
.search input:focus{border-color:var(--grain)}
.search svg{color:#4f6155}
header.top .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
header.top .chip[aria-pressed="true"]{background:#fff;color:#17251b;border-color:#fff}
header.top .filters .sel label{color:#d7f0dc}
header.top a{color:#fff}
.srcbadge{color:#d7f0dc}
.card{border-color:transparent;box-shadow:0 1px 2px rgba(23,37,27,.07)}
.card .name,.sheet .bar .t,.empty h2{text-transform:none;letter-spacing:-.02em}
.card .name{font-size:18px}
.hero h2{letter-spacing:-.03em;font-weight:800}
.box{border-color:transparent;box-shadow:0 1px 2px rgba(23,37,27,.07)}

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const MAPA_PAGE='https://dados.agricultura.gov.br/dataset/sistema-de-agrotoxicos-fitossanitarios-agrofit';
const MAPA_CSV='https://dados.agricultura.gov.br/dataset/6c913699-e82e-4da3-a0a1-fb6c431e367f/resource/d30b30d7-e256-484e-9ab8-cd40974e1238/download/agrofitprodutosformulados.csv';
const AGROFIT='https://agrofit.agricultura.gov.br/agrofit_cons/principal_agrofit_cons';

let DB=null;          // base carregada
let P=[];             // produtos enriquecidos
let cultIdx=new Map();// nome normalizado da cultura -> id string
let meta=null;        // {assetId, atualizadoEm, produtos}
let tab='def';
let shown=60;
let assets=null, db=null, canAdmin=false;
const F={q:'',tipo:'todos',grupo:'',cult:'',praga:''};

/* ---------- cache local (offline) ---------- */
const IDB={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('bulanocampo',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async get(k){try{const d=await this.open();return await new Promise(res=>{const t=d.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined)})}catch(e){return undefined}},
  async set(k,v){try{const d=await this.open();await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res})}catch(e){}}
};

/* ---------- enriquecimento ---------- */
const GRUPOS=['Herbicida','Fungicida','Inseticida','Acaricida','Nematicida','Bactericida','Regulador de Crescimento','Feromônio','Formicida','Cupinicida','Moluscicida'];
function parseIA(s){
  return String(s||'').split(/\s\+\s/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const paren=[...x.matchAll(/\(([^()]*)\)/g)].map(m=>m[1]);
    const conc=paren.length?paren[paren.length-1]:'';
    const isConc=/\d/.test(conc)&&/(g\/|%|UFC|mL|ml|kg|L\b|ppm|conidios|unid|cel|OB|PIB|propágulos)/i.test(conc);
    const nome=x.replace(/\s*\(.*$/,'').trim();
    const grupo=paren.slice(0,isConc?-1:undefined).join(' · ');
    return {nome,grupo,conc:isConc?conc:''};
  });
}
function toxOf(s){
  const t=norm(s);let m=t.match(/categoria\s*(\d)/);
  if(m)return {k:'t'+m[1],label:s.replace(/\s{2,}/g,' — ')};
  if(t.includes('nao classificado'))return {k:'tnc',label:'Não classificado'};
  if(t.startsWith('extremamente'))return {k:'t1',label:s+' (classificação antiga)'};
  if(t.startsWith('altamente'))return {k:'t2',label:s+' (classificação antiga)'};
  if(t.startsWith('medianamente'))return {k:'t3',label:s+' (classificação antiga)'};
  if(t.startsWith('pouco toxico'))return {k:'t4',label:s+' (classificação antiga)'};
  return {k:'tx',label:s||'Não informado'};
}
function enrich(d){
  const S=d.S;
  cultIdx=new Map();
  P=d.P.map((p,i)=>{
    const names=p.m.split(';').map(x=>x.trim()).filter(Boolean);
    const classe=S[p.c]||'';
    const ia=parseIA(p.ia);ia.forEach(x=>{x.moa=/biol/i.test(x.grupo)?null:moaOf(x.grupo,x.nome)});
    const bio=/microbiol|biol[oó]gic|ferom[oô]n|semioqu[ií]m/i.test(classe)||/\(biol[oó]gico\)/i.test(p.ia);
    const grupos=GRUPOS.filter(g=>norm(classe).includes(norm(g).slice(0,8)));
    const iaKey=ia.map(x=>norm(x.nome)).sort().join('+');
    const compKey=ia.map(x=>norm(x.nome)+'@'+norm(x.conc).replace(/\s/g,'')).sort().join('+');
    p.u.forEach(([c])=>{const n=S[c];if(!cultIdx.has(norm(n)))cultIdx.set(norm(n),c)});
    return {i,raw:p,reg:p.r,nome:names[0]||p.m,aka:names.slice(1),classe,ia,bio,grupos,
      form:S[p.f]||'',tit:S[p.t]||'',modo:S[p.mo]||'',tox:toxOf(S[p.tx]||''),amb:S[p.am]||'',org:S[p.o]||'',
      iaKey,compKey,key:norm([p.m,p.ia,S[p.t],p.r].join(' ')),cults:new Set(p.u.map(u=>u[0]))};
  }).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
  const dl=$('#dlCult');
  dl.innerHTML=[...cultIdx.keys()].map(k=>S[cultIdx.get(k)]).sort((a,b)=>a.localeCompare(b,'pt')).map(n=>`<option value="${esc(n)}">`).join('');
}

/* ---------- filtro ---------- */
function prayIds(q){
  const n=norm(q).trim();if(n.length<3)return null;
  const S=DB.S;const set=new Set();
  DB.PR.forEach(([a,b],i)=>{if(norm(S[a]).includes(n)||norm(S[b]).includes(n))set.add(i)});
  return set;
}
function filtered(){
  const terms=norm(F.q).split(/\s+/).filter(Boolean);
  const cId=F.cult?cultIdx.get(norm(F.cult).trim()):undefined;
  const cultOn=!!F.cult.trim();
  const pr=prayIds(F.praga);
  return P.filter(p=>{
    if(F.tipo==='bio'&&!p.bio)return false;
    if(F.tipo==='quim'&&p.bio)return false;
    if(F.grupo&&!p.grupos.includes(F.grupo))return false;
    if(terms.length&&!terms.every(t=>p.key.includes(t)))return false;
    if(cultOn){
      if(cId===undefined)return false;
      if(!p.cults.has(cId)&&!p.cults.has(cultIdx.get('todas as culturas')))return false;
    }
    if(pr){
      const ok=p.raw.u.some(([c,ps])=>(!cultOn||c===cId||DB.S[c]==='Todas as culturas')&&ps.some(x=>pr.has(x)));
      if(!ok)return false;
    }
    return true;
  });
}

/* ---------- telas ---------- */
const fmtN=n=>n.toLocaleString('pt-BR');
const fmtD=iso=>{try{return new Date(iso).toLocaleDateString('pt-BR')}catch(e){return iso}};
function card(p){
  const ia=p.ia.map(x=>x.nome+(x.conc?` ${x.conc}`:'')).join(' + ');
  return `<button class="card" data-i="${p.i}"><span class="band ${p.tox.k}" aria-hidden="true"></span><span class="body">
    <span class="l1"><span class="name">${esc(p.nome)}</span><span class="reg">Reg. ${esc(p.reg)}</span></span>
    <span class="ia">${esc(ia)}</span>
    <span class="meta">${p.bio?'<span class="pill bio">Biológico</span>':''}<span class="pill">${esc(p.classe)}</span>${p.org==='SIM'?'<span class="pill org">Uso em orgânicos</span>':''}<span>${esc(p.tit)}</span></span>
  </span></button>`;
}
function renderDef(){
  const v=$('#view');ftLabel();
  if(!DB){v.innerHTML=emptyState();bindAdmin();return}
  const list=filtered();
  const active=F.q||F.tipo!=='todos'||F.grupo||F.cult||F.praga;
  const mu=meta&&meta.mudancas;
  v.innerHTML=`${mu&&(mu.nNovos||mu.nRemovidos)&&!active?`<details class="box mud"><summary><b>Atualização da base de ${fmtD(meta.atualizadoEm)}:</b> ${fmtN(mu.nNovos)} novo${mu.nNovos===1?'':'s'} registro${mu.nNovos===1?'':'s'} · ${fmtN(mu.nRemovidos)} saíram da lista</summary>${mu.novos.length?`<h3>Novos registros</h3><div class="gen">${mu.novos.map(([r,n])=>{const p=P.find(x=>x.reg===r);return p?`<button data-i="${p.i}" class="mudopen"><b>${esc(n)}</b><span>Reg. ${esc(r)}</span></button>`:''}).join('')}</div>`:''}${mu.removidos.length?`<h3>Saíram da base (registro cancelado ou suspenso)</h3><ul class="steps">${mu.removidos.map(([r,n])=>`<li>${esc(n)} <span class="muted">Reg. ${esc(r)}</span></li>`).join('')}</ul>`:''}</details>`:''}<div class="count"><span><b>${fmtN(list.length)}</b> de ${fmtN(P.length)} produtos registrados</span>${active?'<button class="clear" id="clr">Limpar filtros</button>':''}</div>
    <div class="list">${list.slice(0,shown).map(card).join('')}</div>
    ${list.length>shown?`<button class="more" id="more">Mostrar mais ${fmtN(Math.min(60,list.length-shown))}</button>`:''}
    ${list.length===0?'<div class="empty"><h2>Nada encontrado</h2><p>Tente outro nome ou ingrediente ativo, ou tire algum filtro. Para pragas e culturas, digite pelo menos 3 letras.</p></div>':''}
    ${footer()}`;
  $('#more')?.addEventListener('click',()=>{shown+=60;renderDef()});
  v.querySelectorAll('.mudopen').forEach(b=>b.onclick=()=>openProduct(+b.dataset.i));
  $('#clr')?.addEventListener('click',()=>{Object.assign(F,{q:'',tipo:'todos',grupo:'',cult:'',praga:''});syncInputs();shown=60;renderDef()});
  bindAdmin();
}
function footer(){
  return `<p class="muted">Fonte: AGROFIT/MAPA — dados abertos${meta?.atualizadoEm?`, base de ${fmtD(meta.atualizadoEm)}`:''}. Consulta de apoio: siga sempre a bula e o receituário agronômico.</p>
  ${canAdmin?adminBox():''}`;
}
function emptyState(){
  return `<div class="empty"><h2>A base de produtos ainda não foi carregada</h2>
  <p>O app usa o cadastro oficial do AGROFIT (Ministério da Agricultura), com cerca de 4.400 produtos formulados — químicos e biológicos — e todas as culturas e alvos registrados.</p>
  ${canAdmin?'<p>Como você administra o app, carregue a base pelo painel abaixo. Depois disso ela fica disponível para todo mundo que abrir o link e funciona sem internet.</p>':'<p>Carregando a base de produtos… Na primeira vez pode levar alguns segundos; depois ela fica salva neste aparelho para uso offline.</p>'}
  </div>${canAdmin?adminBox():''}`;
}
function adminBox(){
  return `<div class="box admin" id="adminBox"><h3>Atualizar base (administrador)</h3>
    <ol class="steps">
      <li>Baixe o arquivo <b>Produto Formulado (.csv)</b> do MAPA: <a href="${MAPA_CSV}" target="_blank" rel="noopener">download direto</a> (cerca de 400 MB) ou pela <a href="${MAPA_PAGE}" target="_blank" rel="noopener">página do conjunto de dados</a>.</li>
      <li>Selecione o arquivo aqui. Ele é processado no seu navegador e vira uma base compacta de uns 2 MB.</li>
      <li>Toque em publicar. Todo mundo que usa o app recebe a base nova.</li>
    </ol>
    <input type="file" id="csvFile" accept=".csv,text/csv">
    <div class="progress" hidden id="prog"><i></i></div>
    <p class="muted" id="adminMsg">${meta?.atualizadoEm?`Base atual: ${fmtN(meta.produtos)} produtos, carregada em ${fmtD(meta.atualizadoEm)}.`:'Nenhuma base publicada ainda.'}</p>
    <div class="btnrow"><button class="btn" id="pubBtn" hidden>Publicar base</button></div>
  </div>`;
}
/* ---------- foliares (catálogo próprio, salvo no banco do app) ---------- */
const NUTR=['N','P2O5','K2O','Ca','Mg','S','B','Zn','Mn','Cu','Fe','Mo','Co','Ni','Si','COT'];
const TIPOS_FOL=['Granulado de solo','Foliar','Fertilizante especial','Fluido de solo','Organomineral','Bioestimulante','Corretivo','Inoculante','Adjuvante','Outro'];
let sampleFn=null,imgLim=null,SUG=[],sugUnsub=null;
const ROTULO_PROMPT=`As imagens são fotos do rótulo ou da ficha técnica de um fertilizante, foliar, corretivo ou bioestimulante vendido no Brasil. Leia SOMENTE o que está impresso; não complete nada de memória.
Responda só com um objeto JSON neste formato:
{"nome":"nome comercial","empresa":"fabricante ou registrante","registro":"número de registro MAPA como impresso, ou vazio","tipo":"um de: ${TIPOS_FOL.join(', ')}","natureza":"natureza física (ex.: Sólido granulado, Fluido em solução, Fluido em suspensão, Pó)","garantias":[{"n":"código","v":"número com ponto decimal","u":"% ou g/L"}],"indicacao":"culturas, doses e modo de uso como impresso, resumido","legivel":true}
Códigos de garantia permitidos: ${NUTR.join(', ')} (P2O5 e K2O como no rótulo; COT = carbono orgânico total). Se o rótulo der % (m/m) e g/L, use %. Omita garantias que não aparecem. Se a imagem não for um rótulo de fertilizante ou estiver ilegível, devolva {"legivel":false}.`;
let FOL=[];let folLoaded=false;let folUnsub=null;
const FF={q:'',nut:new Set(),tipo:''};
let folEdit=null; // doc em edição
function folMatch(p){
  if(FF.tipo&&p.tipo!==FF.tipo)return false;
  for(const n of FF.nut){if(!(p.garantias||[]).some(g=>g.n===n&&parseFloat(String(g.v).replace(',','.'))>0))return false}
  const t=norm(FF.q).split(/\s+/).filter(Boolean);
  if(t.length){const k=norm([p.nome,p.empresa,p.registro,p.tipo,p.indicacao,(p.garantias||[]).map(g=>g.n).join(' ')].join(' '));if(!t.every(x=>k.includes(x)))return false}
  return true;
}
const garTxt=p=>(p.garantias||[]).map(g=>`${g.n} ${g.v}${g.u||''}`).join(' · ');
/* ---------- calculadora de custo (defensivos) ---------- */
function iaConc(x){const m=String(x.conc||'').replace(/\s/g,'').match(/^([\d.,]+)g\/(L|kg)$/i);return m?{v:pnum(m[1]),u:m[2].toLowerCase()==='l'?'L':'kg'}:null}
function calcDefBox(p){
  let saved={};try{saved=JSON.parse(localStorage.getItem('calcd2:'+p.reg)||'{}')}catch(e){}
  const c0=p.ia.map(iaConc).find(Boolean);
  const un=saved.un||(c0?c0.u:(/p[oó]|gr[aâ]nul|WG|WP|SP/i.test(p.form)?'kg':'L'));
  return `<div class="box calc calcd"><h3>Custo da aplicação</h3>
    <p class="muted" style="margin:0">Digite o preço por litro (ou kg) e a dose que você vai usar (a dose está na bula e no receituário). O app calcula o custo por hectare e quanto você paga por kg de ingrediente ativo, que é a forma justa de comparar produtos da mesma composição.</p>
    <div class="cgrid">
      <label for="d-preco"><span>Preço (R$ por <span class="d-u">${un}</span>)</span><span class="gin"><input id="d-preco" inputmode="decimal" placeholder="Ex.: 76,00" value="${esc(saved.preco||'')}"><select id="d-un" aria-label="Unidade"><option ${un==='L'?'selected':''}>L</option><option ${un==='kg'?'selected':''}>kg</option></select></span></label>
      <label for="d-dose"><span>Dose (<span class="d-u">${un}</span>/ha)</span><input id="d-dose" inputmode="decimal" placeholder="Ex.: 0,5" value="${esc(saved.dose||'')}"></label>
      <label for="d-area">Área (ha, opcional)<input id="d-area" inputmode="decimal" placeholder="Ex.: 120" value="${esc(saved.area||'')}"></label>
    </div>
    <div class="cout" aria-live="polite"></div></div>`;
}
function bindCalcDef(p){
  const box=document.querySelector('.calcd');if(!box)return;const q=id=>box.querySelector('#'+id);
  const upd=()=>{
    const pu=pnum(q('d-preco').value),un=q('d-un').value,dose=pnum(q('d-dose').value),area=pnum(q('d-area').value);
    box.querySelectorAll('.d-u').forEach(e=>e.textContent=un);
    try{localStorage.setItem('calcd2:'+p.reg,JSON.stringify({preco:q('d-preco').value,un,dose:q('d-dose').value,area:q('d-area').value}))}catch(e){}
    const out=box.querySelector('.cout');
    if(!(pu>0)){out.innerHTML='<p class="muted" style="margin:0">Preencha o preço por '+un+'.</p>';return}
    const ias=p.ia.map(x=>({x,c:iaConc(x)})).filter(o=>o.c&&o.c.u===un&&o.c.v>0);
    const rows=ias.map(({x,c})=>({nome:x.nome,conc:x.conc,custo:pu/(c.v/1000),gha:dose>0?c.v*dose:NaN}));
    out.innerHTML=`${dose>0?`<div class="kpis"><div><span>Custo por hectare</span><b>${brl(pu*dose)}</b></div>
      ${area>0?`<div><span>${n2(area,1)} ha</span><b>${brl(pu*dose*area)}</b><small>${n2(dose*area,1)} ${un} no total</small></div>`:''}</div>`:''}

/* ---------- calculadora de custo por nutriente ---------- */
const brl=n=>isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const n2=(n,d=2)=>isFinite(n)?n.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
const pnum=s=>{s=String(s??'').trim();if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const usable=gars=>gars.filter(g=>g.code&&g.code!=='COT'&&isFinite(g.v)&&g.v>0&&(g.u==='%'||g.u==='g/L'));
function calcBox(key,gars,fluido,densReg){
  if(!usable(gars).length)return '';
  let saved={};try{saved=JSON.parse(localStorage.getItem('calc2:'+key)||'{}')}catch(e){}
  const un=saved.un||(fluido?'L':'kg');
  return `<div class="box calc calcf" data-key="${esc(key)}"><h3>Custo por nutriente</h3>
    <p class="muted" style="margin:0">Digite o preço por litro (ou kg) que você pagou ou recebeu de cotação. O app calcula quanto custa cada kg de nutriente, para comparar produtos de igual para igual.</p>
    <div class="cgrid">
      <label for="c-preco"><span>Preço (R$ por <span class="c-u">${un}</span>)</span><span class="gin"><input id="c-preco" inputmode="decimal" placeholder="Ex.: 22,50" value="${esc(saved.preco||'')}"><select id="c-un" aria-label="Unidade"><option ${un==='L'?'selected':''}>L</option><option ${un==='kg'?'selected':''}>kg</option></select></span></label>
      <label for="c-dens" class="c-dens">Densidade (kg/L)<input id="c-dens" inputmode="decimal" value="${esc(saved.dens||(densReg?String(densReg).replace('.',','):''))}" placeholder="Ex.: 1,35"></label>
      <label for="c-dose"><span>Dose (<span class="c-u">${un}</span>/ha, opcional)</span><input id="c-dose" inputmode="decimal" placeholder="Ex.: 2" value="${esc(saved.dose||'')}"></label>
    </div>
    <div class="cout" aria-live="polite"></div>
  </div>`;
}
function bindCalc(gars){
  const box=document.querySelector('.calcf');if(!box)return;
  const use=usable(gars);const q=id=>box.querySelector('#'+id);
  const upd=()=>{
    const preco=pnum(q('c-preco').value),un=q('c-un').value,dens=pnum(q('c-dens').value),dose=pnum(q('c-dose').value);
    box.querySelectorAll('.c-u').forEach(e=>e.textContent=un);
    try{localStorage.setItem('calc2:'+box.dataset.key,JSON.stringify({preco:q('c-preco').value,un,dens:q('c-dens').value,dose:q('c-dose').value}))}catch(e){}
    const hasPct=use.some(g=>g.u==='%'),hasGL=use.some(g=>g.u==='g/L');
    const needDens=(un==='L'&&hasPct)||(un==='kg'&&hasGL);
    box.querySelector('.c-dens').hidden=!needDens;
    const out=box.querySelector('.cout');
    if(!(preco>0)){out.innerHTML='<p class="muted" style="margin:0">Preencha o preço por '+un+'.</p>';return}
    if(needDens&&!(dens>0)){out.innerHTML=`<p class="note">Este produto tem garantia em ${hasPct&&un==='L'?'% (peso)':'g/L'} e o preço está por ${un}. Informe a densidade (está no rótulo ou na ficha técnica, em g/mL ou kg/L) para converter.</p>`;return}
    // 1 unidade de produto (1 L ou 1 kg)
    const massa=un==='kg'?1:(dens||0), vol=un==='L'?1:1/(dens||1);
    const rows=use.map(g=>{const kgNut=g.u==='%'?massa*g.v/100:vol*g.v/1000;return {g,gPorUn:kgNut*1000,custo:preco/kgNut,gha:dose>0?kgNut*dose*1000:NaN}});
    out.innerHTML=`${dose>0?`<div class="kpis"><div><span>Custo por hectare</span><b>${brl(preco*dose)}</b></div></div>`:''}
    <div class="tablewrap"><table class="ctab"><thead><tr><th>Nutriente</th><th>Por ${un}</th><th>R$ por kg do nutriente</th>${dose>0?'<th>Entrega por ha</th>':''}</tr></thead><tbody>
      ${rows.map(r=>`<tr><td><b>${esc(r.g.code)}</b> <span class="muted">${esc(String(r.g.v).replace('.',','))} ${esc(r.g.u)}</span></td><td>${n2(r.gPorUn,1)} g</td><td><b>${brl(r.custo)}</b></td>${dose>0?`<td>${n2(r.gha,1)} g/ha</td>`:''}</tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="margin:0">O custo de cada nutriente considera o preço inteiro do produto; em produtos com vários nutrientes, compare pelo nutriente principal que você precisa.</p>`;
  };
  const draw=bindRef(box,box.dataset.key,()=>({un:q('c-un').value,preco:pnum(q('c-preco').value)}));const upd2=()=>{upd();draw()};
  box.querySelectorAll('input').forEach(el=>el.addEventListener('input',upd2));
  q('c-un').addEventListener('change',upd2);
  upd2();
}

function garCode(name){
  const n=norm(name).trim();
  if(n.startsWith('carbono organico'))return 'COT';
  if(n.startsWith('p2o5'))return 'P2O5';if(n.startsWith('k2o'))return 'K2O';
  if(/^cao\b/.test(n))return 'Ca';if(/^mgo\b/.test(n))return 'Mg';
  const m=n.match(/^(n|ca|mg|s|b|zn|mn|cu|fe|mo|co|ni|si|se)\b/);
  if(m){const c=m[1];return c==='se'?'Se':c.length===1?c.toUpperCase():c[0].toUpperCase()+c[1]}
  return null;
}
const fnum=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||parseFloat(String(v).replace(',','.'))||0;
function enrichFert(d){
  const S=d.S;
  FP=d.P.map((p,i)=>{
    const [reg,e,n,tipos,f,modos,c,dt,gar]=p;
    const g=gar.map(([gi,v,ui])=>({nome:S[gi],code:garCode(S[gi]),v,u:S[ui]}));
    const nut=new Set(g.filter(x=>x.code&&fnum(x.v)>0).map(x=>x.code));
    const main=g.filter(x=>x.code&&x.code!=='COT'||x.code==='COT').filter(x=>x.code).sort((a,b)=>NUTR.indexOf(a.code)-NUTR.indexOf(b.code));
    const modoTxt=modos.map(m=>S[m]).filter(Boolean);
    return {i,reg,emp:S[e],nome:S[n],tipos:tipos.map(t=>S[t]).filter(Boolean),nat:S[f],modos:modoTxt,cls:S[c],dt,g,nut,
      resumo:main.map(x=>`${x.code} ${x.v}${x.u==='%'?'%':' '+x.u}`).join(' · '),
      gkey:g.map(x=>x.nome+'='+x.v+x.u).sort().join('|'),
      mkey:norm(modoTxt.join(' ')),
      key:norm([reg,S[e],S[n],tipos.map(t=>S[t]).join(' '),S[c]].join(' '))};
  });
}

function moaOf(grupo,nome){const n=norm(nome);if(n)for(const [re,sys,code,label] of MOA_NOME)if(re.test(n))return sys?{sys,code,label,key:sys+' '+code}:null;const g=norm(grupo);if(!g)return null;for(const [re,sys,code,label] of MOA)if(re.test(g))return {sys,code,label,key:sys+' '+code};return null}
const moaPill=m=>m?`<span class="pill moa" title="${esc(m.label)}">${esc(m.key)}</span>`:'';
function itemMoas(it){
  if(it.tipo!=='def')return [];
  const p=P.find(x=>x.reg===it.ref);if(!p)return [];
  const seen=new Map();p.ia.forEach(x=>{if(x.moa&&!seen.has(x.moa.key))seen.set(x.moa.key,x.moa)});return [...seen.values()];
}
function progAlerts(prog){
  const al=[];const count=new Map();
  prog.forEach((ap,i)=>{const ks=new Set(ap.moas.map(m=>m.key));ks.forEach(k=>count.set(k,(count.get(k)||0)+1));
    if(i>0){const prev=new Set(prog[i-1].moas.map(m=>m.key));const rep=[...ks].filter(k=>prev.has(k)&&!/^FRAC M/.test(k));
      if(rep.length)al.push(`<b>${esc(ap.nome)}</b> repete ${rep.map(k=>`<b>${esc(k)}</b>`).join(', ')} da aplicação anterior. Alterne com outro modo de ação.`)}});
  count.forEach((n,k)=>{if(n>=3&&!/^FRAC M/.test(k))al.push(`<b>${esc(k)}</b> aparece em ${n} aplicações do programa. Verifique o número máximo de aplicações por safra na bula.`)});
  return al;
}

// necessidade = soma das aplicações ainda não feitas no programa
function progNeeds(){
  const need=new Map();
  (CAL.prog||[]).forEach(ap=>{if(ap.aplicada||!ap.itens)return;const area=pnum(ap.area);if(!(area>0))return;
    ap.itens.forEach(it=>{const d=pnum(it.dose);if(!(d>0))return;const k=it.key||('n:'+it.nome);const cur=need.get(k)||{nome:it.nome,un:it.un,q:0};cur.q+=d*area;need.set(k,cur)})});
  return need;
}
function aplicar(i){
  const ap=CAL.prog[i];if(!ap||ap.aplicada)return;const area=pnum(ap.area);
  if(area>0&&ap.itens)ap.itens.forEach(it=>{const d=pnum(it.dose);if(it.key&&EST[it.key]&&d>0){const q=pnum(EST[it.key].qtd)||0;EST[it.key].qtd=n2(Math.max(0,q-d*area),2)}});
  ap.aplicada=new Date().toLocaleDateString('pt-BR');saveEst();saveCal();
}
function renderMeus(){
  const v=$('#view');
  const keys=Object.keys(FAV).sort((a,b)=>String(FAV[a].nome).localeCompare(String(FAV[b].nome),'pt'));
  const need=progNeeds();
  let valor=0,semPreco=0,baixo=0;
  let avisos=0;
  const rows=keys.map(k=>{const fm=favMeta(k);const gone=!fm&&((k.startsWith('d:')&&P.length>0)||(k.startsWith('f:')&&FP.length>0));if(gone)avisos++;const m=fm||{nome:FAV[k].nome,sub:FAV[k].sub,un:'L',open:null};const e=EST[k]||{};const un=e.un||m.un;const q=pnum(e.qtd),min=pnum(e.min);
    const pr=priceOf(k);const val=q>0&&pr.preco>0&&(!pr.un||pr.un===un)?q*pr.preco:NaN;if(isFinite(val))valor+=val;else if(q>0)semPreco++;

/* ---------- preço de referência da comunidade ---------- */
const UFS=['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO'];
let PRECOS=new Map(),myUid=null,precosUnsub=null,myPrecos=null;
let myUF=lsGet('uf:v1','');
const mesAtual=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function mesesAtras(m){const [y,mm]=m.split('-').map(Number);const d=new Date();return (d.getFullYear()-y)*12+(d.getMonth()+1-mm)}
function startPrecos(userNs){
  if(!db||precosUnsub)return;
  (async()=>{try{myUid=userNs?await userNs.id():null}catch(e){}
    precosUnsub=db.collection('precos').onSnapshot(snap=>{
      const map=new Map();myPrecos=null;
      snap.docs.forEach(d=>{const data=d.data()||{};if(d.id===myUid)myPrecos=data;
        (Array.isArray(data.itens)?data.itens:[]).forEach(it=>{const p=Number(it.preco);if(!it.k||!(p>0&&p<100000)||!/^(L|kg)$/.test(it.un)||!/^\d{4}-\d{2}$/.test(it.mes||''))return;if(mesesAtras(it.mes)>12)return;
          const arr=map.get(it.k)||[];arr.push({preco:p,un:it.un,uf:UFS.includes(it.uf)?it.uf:'',mes:it.mes});map.set(it.k,arr)})});
      PRECOS=map;document.querySelectorAll('.refp').forEach(el=>el.dispatchEvent(new Event('refresh')));
    },err=>console.warn(err));
  })();
}
function stats(arr){if(!arr.length)return null;const v=arr.map(x=>x.preco).sort((a,b)=>a-b);const mid=v.length>>1;return {n:v.length,med:v.length%2?v[mid]:(v[mid-1]+v[mid])/2,min:v[0],max:v[v.length-1]}}
function refHtml(key,un,preco){
  if(!db)return '';
  const all=(PRECOS.get(key)||[]).filter(x=>x.un===un);
  const s=stats(all);const su=myUF?stats(all.filter(x=>x.uf===myUF)):null;
  let h='';
  if(s&&s.n>=3){
    h+=`<div class="refline"><span>Preço de referência da comunidade · últimos 12 meses</span><b>${brl(s.med)}/${un}</b> <small>mediana de ${s.n} preços · faixa ${brl(s.min)} a ${brl(s.max)}</small></div>`;
    if(su&&su.n>=3)h+=`<div class="refline"><span>Em ${esc(myUF)}</span><b>${brl(su.med)}/${un}</b> <small>${su.n} preços</small></div>`;
    if(preco>0){const dif=(preco/(su&&su.n>=3?su.med:s.med)-1)*100;h+=`<p class="muted" style="margin:0">Seu preço está <b>${Math.abs(dif)<3?'na média':n2(Math.abs(dif),0)+'% '+(dif>0?'acima':'abaixo')}</b> da mediana${su&&su.n>=3?' da sua UF':''}.</p>`}
  }else h+=`<p class="muted" style="margin:0">Ainda não há preços suficientes da comunidade para este produto${s?` (${s.n} de 3 necessários)`:''}. Compartilhe o seu e ajude a formar a referência.</p>`;
  if(db&&myUid){
    const mine=(myPrecos&&Array.isArray(myPrecos.itens)?myPrecos.itens:[]).find(x=>x.k===key);
    h+=`<div class="sharerow"><select class="ref-uf" aria-label="Seu estado"><option value="">UF</option>${UFS.map(u=>`<option ${u===myUF?'selected':''}>${u}</option>`).join('')}</select>
      <button class="btn ghost ref-share" ${preco>0?'':'disabled'}>${mine?'Atualizar meu preço':'Compartilhar meu preço'} (anônimo)</button></div>
      ${mine?`<p class="muted" style="margin:0">Você informou ${brl(Number(mine.preco))}/${esc(mine.un)} em ${esc(mine.mes.split('-').reverse().join('/'))}.</p>`:''}
      <p class="muted ref-msg" style="margin:0"></p>`;
  }
  return h;
}
function bindRef(box,key,getVals){
  let el=box.querySelector('.refp');if(!el){el=document.createElement('div');el.className='refp';box.appendChild(el)}
  const draw=()=>{const {un,preco}=getVals();el.innerHTML=refHtml(key,un,preco);
    const uf=el.querySelector('.ref-uf');if(uf)uf.onchange=()=>{myUF=uf.value;lsSet('uf:v1',myUF);draw()};
    const b=el.querySelector('.ref-share');if(b)b.onclick=async()=>{
      const {un,preco}=getVals();const msg=el.querySelector('.ref-msg');
      if(!myUF){msg.textContent='Escolha sua UF antes de compartilhar.';return}
      if(!(preco>0&&preco<100000)){msg.textContent='Digite um preço válido.';return}
      b.disabled=true;msg.textContent='Enviando…';
      try{
        const ref=db.collection('precos').doc(myUid);const cur=await ref.get();
        const itens=(cur.exists&&Array.isArray(cur.data().itens)?cur.data().itens:[]).filter(x=>x.k!==key);
        itens.push({k:key,preco:Math.round(preco*100)/100,un,uf:myUF,mes:mesAtual()});
        await ref.set({itens:itens.slice(-400)});
        msg.textContent='Obrigado! Seu preço entrou na referência, sem identificar você.';
      }catch(err){b.disabled=false;msg.textContent=err?.code==='not_granted'||err?.code==='permission_denied'?'Sua conta não tem permissão para compartilhar preços neste app.':'Não foi possível enviar ('+(err.code||err.message)+').'}
    };
  };
  el.addEventListener('refresh',draw);
  return draw;
}

  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const msg=$('#zMsg'),prog=$('#zprog'),bar=prog.querySelector('i');prog.hidden=false;msg.textContent='Processando '+f.name+'…';
    const w=new Worker(URL.createObjectURL(new Blob([ZWORKER],{type:'text/javascript'})));
    w.onmessage=e=>{const d=e.data;if(d.prog!==undefined){bar.style.width=(d.prog*100).toFixed(1)+'%';return}
      if(d.error){msg.textContent=d.error;prog.hidden=true;w.terminate();return}
      if(d.done){w.terminate();bar.style.width='100%';zPending=d.done;const nm=Object.keys(d.done.MUN).length;
        msg.innerHTML=`Pronto: ${fmtN(d.done.R.length)} combinações em ${fmtN(nm)} municípios (de ${fmtN(d.done.linhas)} linhas). Valores encontrados nos decêndios: ${esc(d.vals.map(([k,n])=>`"${k}"`).join(' '))}.`;
        const b=$('#zPub');b.hidden=false;b.onclick=publishZarc}};
    w.postMessage(f)};
}
async function publishZarc(){
  const msg=$('#zMsg'),b=$('#zPub');if(!zPending)return;b.disabled=true;msg.textContent='Enviando…';
  try{const text=JSON.stringify(zPending);const up=await assets.upload(new Blob([text],{type:'application/json'}),{type:'application/json'});
    const m={assetId:up.id,atualizadoEm:zPending.gerado,combinacoes:zPending.R.length,bytes:up.sizeBytes};await db.doc('config/zarc').set(m);
    await IDB.set('zarc',{assetId:up.id,data:zPending});zmeta=m;ZARC=zPending;zPending=null;renderPlantio();
  }catch(e){msg.textContent='Não foi possível publicar ('+(e.code||e.message||e)+').';b.disabled=false}
}

const saveCal=()=>{try{localStorage.setItem(CK,JSON.stringify(CAL))}catch(e){}};
// ordem de mistura: regra geral por formulação
const ORDEM=[
  {g:'Pós e grânulos (WP, WG, SG, SP, DF)',re:/^(WP|WG|WDG|SG|SP|DF|GD|WS)$/},
  {g:'Suspensões (SC, CS, SE, FS, ZC)',re:/^(SC|CS|SE|FS|ZC|SS)$/},
  {g:'Emulsões e dispersões em óleo (EC, EW, OD, ME, DC)',re:/^(EC|EW|OD|ME|DC|EO|OL)$/},
  {g:'Soluções (SL, LS)',re:/^(SL|LS|SC?L|AL)$/},
  {g:'Fertilizantes foliares',re:/^FERT$/},
  {g:'Adjuvantes e óleos',re:/^ADJ$/},
  {g:'Outros / não identificado',re:/.*/}];
function formCode(it){
  if(it.tipo==='fert')return 'FERT';
  if(it.tipo==='adj')return 'ADJ';
  const c=String(it.form||'').split(' - ')[0].trim().toUpperCase();return c||'?';
}
function grupoOrdem(it){const c=formCode(it);return ORDEM.findIndex(o=>o.re.test(c))}
function pickResults(qs){
  const t=norm(qs).split(/\s+/).filter(Boolean);if(!t.length)return [];
  const out=[];
  for(const p of P){if(t.every(x=>p.key.includes(x))){out.push({tipo:'def',ref:p.reg,nome:p.nome,sub:p.ia.map(x=>x.nome).join(' + '),form:p.form,un:(iaConc(p.ia[0]||{})||{}).u||(/p[oó]|gr[aâ]nul|WG|WP|SP/i.test(p.form)?'kg':'L')});if(out.length>=8)break}}
  for(const p of FOL){const k=norm([p.nome,p.empresa,p.registro].join(' '));if(t.every(x=>k.includes(x))){out.push({tipo:'fert',ref:'c:'+p._id,nome:p.nome,sub:garTxt(p),form:'',un:/s[oó]lid|gr[aâ]nul|p[oó]/i.test(p.natureza||'')?'kg':'L'});if(out.length>=12)break}}
  if(out.length<12)for(const p of FP){if(!p.mkey.includes('foliar'))continue;if(t.every(x=>p.key.includes(x))){out.push({tipo:'fert',ref:'f:'+p.reg,nome:p.resumo||p.nome,sub:p.emp+' · Reg. '+p.reg,form:'',un:/SOLID/i.test(p.nat)?'kg':'L'});if(out.length>=16)break}}
  return out;
}
function prefillPreco(it){
  try{
    if(it.tipo==='def'){const s=JSON.parse(localStorage.getItem('calcd2:'+it.ref)||'{}');return {preco:s.preco||'',dose:s.dose||'',un:s.un||it.un}}
    const s=JSON.parse(localStorage.getItem('calc2:'+it.ref)||'{}');return {preco:s.preco||'',dose:s.dose||'',un:s.un||it.un};
  }catch(e){return {preco:'',dose:'',un:it.un}}
}
function calibCalc(){
  const v=pnum(CAL.vel),e=pnum(CAL.esp),q=pnum(CAL.bico),a=pnum(CAL.alvo);
  const lha=v>0&&e>0&&q>0?q*60000/(v*e):NaN;
  const qNec=v>0&&e>0&&a>0?a*v*e/60000:NaN;
  return {lha,qNec};
}

/* ---------- importação (admin) ---------- */
const WORKER=`
self.onmessage=async e=>{try{
  const file=e.data;const size=file.size;
  const reader=file.stream().pipeThrough(new TextDecoderStream('utf-8')).getReader();
  const S=[],SI=new Map();const s=v=>{v=(v||'').trim().replace(/\\s+/g,' ');let i=SI.get(v);if(i===undefined){i=S.length;S.push(v);SI.set(v,i)}return i};
  const PR=[],PRI=new Map();const pr=(a,b)=>{const k=a+'|'+b;let i=PRI.get(k);if(i===undefined){i=PR.length;PR.push([s(a),s(b)]);PRI.set(k,i)}return i};
  const P=new Map();let idx=null,buf='',carry='',chars=0,n=0,bad=0,repl=0;
  function parse(l){const row=[];let f='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'){if(l[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"'&&f.trim()==='')q=true;else if(c===';'){row.push(f);f=''}else f+=c}}row.push(f);return [row,q]}
  const need=['NR_REGISTRO','MARCA_COMERCIAL','FORMULACAO','INGREDIENTE_ATIVO','TITULAR_DE_REGISTRO','CLASSE','MODO_DE_ACAO','CULTURA','PRAGA_NOME_CIENTIFICO','PRAGA_NOME_COMUM','CLASSE_TOXICOLOGICA','CLASSE_AMBIENTAL','ORGANICOS','SITUACAO'];
  function line(l){
    l=l.replace(/\\r$/,'');if(!l)return;
    if(!idx){const h=l.replace(/^\\uFEFF/,'').split(';').map(x=>x.trim());idx={};need.forEach(k=>{idx[k]=h.indexOf(k)});const miss=need.filter(k=>idx[k]<0);if(miss.length)throw new Error('Arquivo não parece ser o "Produto Formulado" do AGROFIT. Colunas ausentes: '+miss.join(', '));idx.len=h.length;return}
    let [r,open]=parse(carry+l);if(open){carry+=l+'\\n';return}carry='';
    if(r.length<idx.len){bad++;return}
    const g=k=>r[idx[k]]||'';
    if(/^false$/i.test(g('SITUACAO').trim()))return;
    n++;const reg=g('NR_REGISTRO').trim();let p=P.get(reg);
    if(!p){p={r:reg,m:g('MARCA_COMERCIAL').trim().replace(/\\s+/g,' '),f:s(g('FORMULACAO')),ia:g('INGREDIENTE_ATIVO').trim().replace(/\\s+/g,' '),t:s(g('TITULAR_DE_REGISTRO')),c:s(g('CLASSE')),mo:s(g('MODO_DE_ACAO')),tx:s(g('CLASSE_TOXICOLOGICA')),am:s(g('CLASSE_AMBIENTAL')),o:s(g('ORGANICOS')),u:new Map()};P.set(reg,p)}
    const cu=s(g('CULTURA'));let set=p.u.get(cu);if(!set){set=new Set();p.u.set(cu,set)}set.add(pr(g('PRAGA_NOME_CIENTIFICO'),g('PRAGA_NOME_COMUM')));
  }
  for(;;){const {done,value}=await reader.read();if(done)break;chars+=value.length;
    for(let k=0;k<value.length;k++)if(value.charCodeAt(k)===65533)repl++;
    buf+=value;let e2;let st=0;while((e2=buf.indexOf('\\n',st))>=0){line(buf.slice(st,e2));st=e2+1}buf=buf.slice(st);
    postMessage({prog:Math.min(.99,chars/size)});}
  if(buf)line(buf);
  if(repl>1000)throw new Error('O arquivo não está em UTF-8 (talvez tenha sido aberto e salvo no Excel). Baixe de novo direto do site do MAPA e selecione sem abrir.');
  const out={v:1,fonte:'AGROFIT/MAPA - Produto Formulado',gerado:new Date().toISOString(),linhas:n,S,PR,P:[...P.values()].map(p=>({...p,u:[...p.u].map(([c,set])=>[c,[...set]])}))};
  postMessage({done:out,bad});
}catch(err){postMessage({error:String(err.message||err)})}};`;
let pending=null;
function bindAdmin(){
  const inp=$('#csvFile');if(!inp)return;
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const msg=$('#adminMsg'),prog=$('#prog'),bar=prog.querySelector('i');
    prog.hidden=false;bar.style.width='0';$('#pubBtn').hidden=true;msg.textContent='Processando '+f.name+'…';
    const w=new Worker(URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'})));
    w.onmessage=e=>{const d=e.data;
      if(d.prog!==undefined){bar.style.width=(d.prog*100).toFixed(1)+'%';return}
      if(d.error){msg.textContent=d.error;prog.hidden=true;w.terminate();return}
      if(d.done){w.terminate();bar.style.width='100%';pending=d.done;
        msg.textContent=`Pronto: ${fmtN(d.done.P.length)} produtos e ${fmtN(d.done.linhas)} registros de uso. Confira e publique.`;
        $('#pubBtn').hidden=false;$('#pubBtn').onclick=publishBase;}
    };
    w.postMessage(f);
  };
}
async function publishBase(){
  const msg=$('#adminMsg'),btn=$('#pubBtn');if(!pending)return;
  btn.disabled=true;msg.textContent='Enviando…';
  try{
    const text=JSON.stringify(pending);
    const up=await assets.upload(new Blob([text],{type:'application/json'}),{type:'application/json'});
    const m={assetId:up.id,atualizadoEm:pending.gerado,produtos:pending.P.length,bytes:up.sizeBytes};
    if(DB&&Array.isArray(DB.P)){const nomeDe=p=>p.m.split(';')[0].trim();const antes=new Map(DB.P.map(p=>[p.r,nomeDe(p)])),depois=new Map(pending.P.map(p=>[p.r,nomeDe(p)]));
      const novos=[...depois].filter(([r])=>!antes.has(r)),saiu=[...antes].filter(([r])=>!depois.has(r));
      m.mudancas={de:DB.gerado||'',nNovos:novos.length,nRemovidos:saiu.length,novos:novos.slice(0,300),removidos:saiu.slice(0,300)};}
    await db.doc('config/base').set(m);
    await IDB.set('base',{assetId:up.id,data:pending});
    meta=m;DB=pending;enrich(DB);pending=null;
    msg.textContent='Base publicada.';btn.hidden=true;render();
  }catch(e){msg.textContent='Não foi possível publicar ('+(e.code||e.message||e)+'). Tente de novo em instantes.';btn.disabled=false}
}

/* ---------- inicialização ---------- */
async function loadFromCache(){
  const c=await IDB.get('base');
  if(c&&c.data){DB=c.data;meta=meta||{assetId:c.assetId,atualizadoEm:c.data.gerado,produtos:c.data.P.length};enrich(DB);render();return c.assetId}
  return null;
}
async function boot(){
  render();
  const cachedId=await loadFromCache();
  if(!window.claude?.use){await loadStaticBase();startFol();loadFert();loadPosStatic();render();return}
  try{
    const [dbns,asns,user]=await Promise.all([claude.use('db'),claude.use('assets'),claude.use('user')]);
    db=dbns;assets=asns;
    try{sampleFn=await claude.use('sample');const lim=sampleFn?await sampleFn.limits().catch(()=>null):null;imgLim=lim?.images||null}catch(e){}
    canAdmin=!!(assets&&db)&&((await user?.canEdit())??false);
    if(db){
      const snap=await db.doc('config/base').get();
      if(snap.exists){
        meta=snap.data();
        if(meta.assetId&&meta.assetId!==cachedId){
          const r=await fetch('/_blob/'+meta.assetId);
          if(r.ok){DB=await r.json();enrich(DB);await IDB.set('base',{assetId:meta.assetId,data:DB})}
        }
      }
    }
    startPrecos(user);
  }catch(e){console.warn('Sem conexão com a base online; usando a cópia salva.',e)}
  await loadStaticBase();
  startFol();loadFert();startPos();loadPosStatic();
  render();
}
// base publicada junto com a página: funciona para qualquer pessoa que consiga abrir o app
async function loadStaticBase(){
  try{
    const r=await fetch('data/agrofit.json');if(!r.ok)return;
    const d=await r.json();
    if(!DB||(d.gerado&&DB.gerado&&d.gerado>DB.gerado)){DB=d;meta={atualizadoEm:d.gerado,produtos:d.P.length,mudancas:d.mudancas||null};enrich(DB);await IDB.set('base',{assetId:'static:'+d.gerado,data:DB});render()}
  }catch(e){console.warn(e)}
}
boot();
})();
